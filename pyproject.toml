readme = "README.md"
authors = [
    { name = "CODEsane04", email = "debjitcodes18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
